<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Stable Andrews–Curtis Conjecture</title>
<style>
  /* ---------- fonts (offline) ---------- */
  @font-face { font-family: 'Figtree'; src: url('fonts/figtree-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Figtree'; src: url('fonts/figtree-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Figtree'; src: url('fonts/figtree-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('fonts/plexmono-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }

  /* ---------- tokens ---------- */
  :root {
    --paper: #FAF9F6;
    --ink: #191813;
    --blue: #2B54C4;
    --orange: #E05B2B;
    --hair: rgba(25, 24, 19, 0.15);
    --sans: 'Figtree', -apple-system, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ---------- letterbox stage: design at 1920x1080, scale to fit ---------- */
  .viewport { position: fixed; inset: 0; }
  /* 4:3 canvas — SFP requires 4:3, some campus screens crop 16:9 */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    background: var(--paper);
  }

  /* ---------- slides ---------- */
  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: 88px 84px 56px;
    overflow: hidden;
  }
  .slide.active { display: flex; }

  .slide header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 40px;
    flex: 0 0 auto;
  }
  .slide h1 {
    font-weight: 700;
    font-size: 62px;
    letter-spacing: -0.02em;
    line-height: 0.98;
    max-width: 20ch;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 24px;
    color: rgba(25, 24, 19, 0.6);
    text-align: right;
    max-width: 30ch;
    line-height: 1.35;
  }
  .viz {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
    margin-top: 24px;
  }
  .viz svg { width: 100%; height: 100%; }

  /* ---------- utilities for slide content ---------- */
  .mono { font-family: var(--mono); }
  .blue { color: var(--blue); }
  .orange { color: var(--orange); }
  .dim { opacity: 0.6; }

  /* ---------- hud ---------- */
  .hud {
    position: absolute; right: 36px; bottom: 28px; z-index: 5;
    font-family: var(--mono); font-size: 28px;
    color: var(--ink); opacity: 0.55;
    transition: opacity 0.2s;
    user-select: none;
  }
  .viewport:hover .hud { opacity: 0.7; }
  .hud .appendix-tag { color: var(--orange); }

  /* skip the remaining sub-steps of a stepped slide and move on */
  .skipbtn {
    position: absolute; right: 36px; bottom: 82px; z-index: 6;
    font-family: var(--mono); font-size: 20px; line-height: 1;
    color: var(--ink); background: none;
    border: 1px solid rgba(25, 24, 19, 0.25); border-radius: 999px;
    padding: 9px 18px; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .skipbtn.on { opacity: 0.3; pointer-events: auto; }
  .skipbtn.on:hover { opacity: 0.85; }

  /* present: go fullscreen, like the present button in Slides */
  .presentbtn {
    position: absolute; left: 36px; bottom: 36px; z-index: 6;
    font-family: var(--mono); font-size: 20px; line-height: 1;
    color: var(--ink); background: none;
    border: 1px solid rgba(25, 24, 19, 0.25); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; opacity: 0.3;
    transition: opacity 0.2s;
  }
  .presentbtn:hover { opacity: 0.9; }
  /* lit while a phone (or any second device) is driving the deck through serve.py */
  .presentbtn .link { color: var(--blue); margin-left: 10px; display: none; }
  .presentbtn.linked .link { display: inline; }

  /* slide menu: a hamburger at top-left drops down every slide by title */
  .navbtn {
    position: absolute; left: 28px; top: 22px; z-index: 8;
    width: 46px; height: 46px; padding: 0;
    font-family: var(--mono); font-size: 21px; line-height: 1;
    color: var(--ink); background: none; cursor: pointer;
    border: 1px solid rgba(25, 24, 19, 0.22); border-radius: 999px;
    opacity: 0.22; transition: opacity 0.2s;
  }
  .navbtn:hover, .navbtn.open { opacity: 0.9; }
  .navmenu {
    position: absolute; left: 28px; top: 80px; z-index: 8;
    width: 528px; max-height: 880px; overflow-y: auto;
    padding: 10px; border-radius: 18px;
    background: var(--paper);
    border: 1px solid rgba(25, 24, 19, 0.14);
    box-shadow: 0 26px 64px rgba(25, 24, 19, 0.18);
    opacity: 0; transform: translateX(-16px); pointer-events: none;
    transition: opacity 0.16s, transform 0.16s;
  }
  .navmenu.open { opacity: 1; transform: none; pointer-events: auto; }
  .navmenu button {
    display: flex; align-items: baseline; gap: 12px; width: 100%;
    padding: 8px 14px; border: 0; border-radius: 10px;
    background: none; cursor: pointer; text-align: left;
    font-family: var(--mono); font-size: 18px; line-height: 1.3; color: var(--ink);
  }
  .navmenu button .num { flex: 0 0 40px; opacity: 0.4; }
  .navmenu button:hover { background: rgba(43, 84, 196, 0.10); color: var(--blue); }
  .navmenu button.on { background: var(--ink); color: var(--paper); }
  .navmenu button.on .num { opacity: 0.65; }
  .navmenu button.apx .num { color: var(--orange); opacity: 0.9; }
  .navmenu .rule { border-top: 1px solid rgba(25, 24, 19, 0.12); margin: 8px 14px; }

  .placeholder-missing {
    display: flex; align-items: center; justify-content: center;
    height: 100%;
    font-family: var(--mono); font-size: 30px; color: var(--orange);
  }

  /* click-through frames inside one slide */

    flex: 1 1 auto;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  [data-steps] [data-at] {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.38s ease;
  }
  [data-steps][data-step="0"] [data-at~="0"],

  [data-steps] .xline {

  }
  [data-steps] .xline.slow {

  [data-steps][data-step="0"] [data-at~="0"] .xline,
  [data-steps][data-step="1"] [data-at~="1"] .xline,
  [data-steps][data-step="2"] [data-at~="2"] .xline,
  [data-steps][data-step="3"] [data-at~="3"] .xline,
  [data-steps][data-step="4"] [data-at~="4"] .xline,
  [data-steps][data-step="5"] [data-at~="5"] .xline,
  [data-steps][data-step="6"] [data-at~="6"] .xline,
  [data-steps][data-step="7"] [data-at~="7"] .xline,
  [data-steps][data-step="8"] [data-at~="8"] .xline,
  [data-steps][data-step="9"] [data-at~="9"] .xline,

  [data-steps][data-step="11"] [data-at~="11"] .xline,

  [data-steps][data-step="13"] [data-at~="13"] .xline,
  [data-steps][data-step="14"] [data-at~="14"] .xline,
  [data-steps][data-step="15"] [data-at~="15"] .xline,
  [data-steps][data-step="16"] [data-at~="16"] .xline {
    stroke-dashoffset: 0;
  }

  .s03b-wrap { position: relative; z-index: 2; }

  }

  }

  }
  #s03b-example [data-steps] .xline,
  #s03b-example [data-steps] .xline.slow {

  }

  @keyframes s03b-xmark {

  }
  #s03b-example .s03b-note, #s03b-example .s03b-post { opacity: 0; }
  #s03b-example [data-steps][data-step="2"] [data-at~="2"] .s03b-note,
  #s03b-example [data-steps][data-step="7"] [data-at~="7"] .s03b-note,
  #s03b-example [data-steps][data-step="10"] [data-at~="10"] .s03b-note,
  #s03b-example [data-steps][data-step="2"] [data-at~="2"] .s03b-post,
  #s03b-example [data-steps][data-step="7"] [data-at~="7"] .s03b-post,

      'a1-asrun', 'a2-path', 'a3-cap', 'a4-beam', 'a5-relabel', 'a6-timeline', 'a7-trivial'

<script>
(function () {
  var stage = document.getElementById('stage');
  var hud = document.getElementById('hud');

  DECK.ORDER.forEach(function (id) {
    var sec = document.createElement('section');
    sec.className = 'slide';
    sec.id = id;
    sec.innerHTML = DECK.parts[id] ||
      '<div class="placeholder-missing">missing part: ' + id + '</div>';
    stage.appendChild(sec);
  });
  stage.appendChild(hud);

  var skipBtn = document.createElement('button');
  skipBtn.type = 'button';
  skipBtn.className = 'skipbtn';
  skipBtn.textContent = 'skip parts →';
  skipBtn.title = 'jump past this slide\u2019s sub-steps  (↓ or n)';
  stage.appendChild(skipBtn);
  skipBtn.addEventListener('click', function (e) { e.stopPropagation(); nextSlide(); });

  var presentBtn = document.createElement('button');
  presentBtn.type = 'button';
  presentBtn.className = 'presentbtn';
  presentBtn.title = 'fullscreen  (f)';
  presentBtn.innerHTML = 'present \u2922<span class="link">\u25cf remote</span>';
  stage.appendChild(presentBtn);
  presentBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFull(); });

  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  }
  document.addEventListener('fullscreenchange', function () {
    presentBtn.firstChild.nodeValue = document.fullscreenElement ? 'exit \u2921' : 'present \u2922';
    fit();
  });

  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var current = -1;

  /* top-left slide menu: a drop-down of every slide, numbered and titled */
  var navBtn = document.createElement('button');
  navBtn.type = 'button';
  navBtn.className = 'navbtn';
  navBtn.title = 'slides  (m)';
  navBtn.textContent = '\u2630';
  var navMenu = document.createElement('div');
  navMenu.className = 'navmenu';

  var navBtns = slides.map(function (sec, i) {
    var n = DECK.APPENDIX_START;
    var h = sec.querySelector('h1');
    var tmp = document.createElement('div');
    tmp.innerHTML = h ? h.innerHTML.replace(/<br\s*\/?>/gi, ' ') : '';
    var raw = h ? tmp.textContent : (sec.textContent || '');
    var title = raw.replace(/\s+/g, ' ').trim().slice(0, 58) || 'slide ' + (i + 1);
    if (i === n) {
      var rule = document.createElement('div');
      rule.className = 'rule';
      navMenu.appendChild(rule);
    }
    var b = document.createElement('button');
    b.type = 'button';
    if (i >= n) b.className = 'apx';
    b.innerHTML = '<span class="num"></span><span class="lab"></span>';
    b.firstChild.textContent = (i < n) ? String(i + 1) : 'A' + (i - n + 1);
    b.lastChild.textContent = title;
    b.addEventListener('click', function (e) { e.stopPropagation(); toggleNav(false); show(i); });
    navMenu.appendChild(b);
    return b;
  });
  stage.appendChild(navBtn);
  stage.appendChild(navMenu);
  navBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleNav(); });

  function toggleNav(force) {
    var on = (force === undefined) ? !navMenu.classList.contains('open') : !!force;
    navMenu.classList.toggle('open', on);
    navBtn.classList.toggle('open', on);
    if (on) syncNav();
  }
  function navOpen() { return navMenu.classList.contains('open'); }
  function syncNav() {
    for (var k = 0; k < navBtns.length; k++) { navBtns[k].classList.toggle('on', k === current); }
    var b = navBtns[current];
    if (b && navOpen()) {
      navMenu.scrollTop = b.offsetTop - (navMenu.clientHeight - b.offsetHeight) / 2;
    }
  }

  function stepper() {
    var sec = slides[current];
    return sec ? sec.querySelector('[data-steps]') : null;
  }
  function stepMax(el) { return parseInt(el.getAttribute('data-steps'), 10) || 0; }
  function stepNow(el) { return parseInt(el.getAttribute('data-step') || '0', 10) || 0; }

  /* auto-chain: data-autochain="2:6900,3:2600" — after landing on step 2 going
     forward, advance to 3 after 6.9s, then to 4 after 2.6s. Lets one S-move play
     as a single animation instead of four clicks. Any manual key cancels it. */
  var chainTimer = null;
  function clearChain() { if (chainTimer) { clearTimeout(chainTimer); chainTimer = null; } }
  function chainAt(el, n) {
    var raw = el.getAttribute('data-autochain');
    if (!raw) return 0;
    var hit = 0;
    raw.split(',').forEach(function (p) {
      var kv = p.split(':');
      if (parseInt(kv[0], 10) === n) hit = parseInt(kv[1], 10) || 0;
    });
    return hit;
  }
  function setStep(el, n, chain) {
    clearChain();
    el.setAttribute('data-step', String(n));
    syncSkip();
    if (chain !== true || n >= stepMax(el)) return;
    var wait = chainAt(el, n);
    if (wait > 0) {
      chainTimer = setTimeout(function () { chainTimer = null; setStep(el, n + 1, true); }, wait);
    }
  }

  /* the skip pill only offers itself when there are sub-steps left to skip */
  function syncSkip() {
    var el = stepper();
    skipBtn.classList.toggle('on', !!el && stepNow(el) < stepMax(el));
  }
  function nextSlide() { clearChain(); show(current + 1); }
  function prevSlide() { clearChain(); show(current - 1); }

  function stepFwd() {
    var el = stepper();
    if (!el) return false;
    var s = stepNow(el), m = stepMax(el);
    if (s < m) { setStep(el, s + 1, true); return true; }
    return false;
  }
  function stepBack() {
    var el = stepper();
    if (!el) return false;
    var s = stepNow(el);
    if (s > 0) { setStep(el, s - 1); return true; }
    return false;
  }

  function setAnimations(sec, run) {
    sec.querySelectorAll('svg').forEach(function (svg) {
      try {
        if (run) { svg.setCurrentTime(0); svg.unpauseAnimations(); }
        else { svg.pauseAnimations(); }
      } catch (e) { /* svg without SMIL support */ }
    });
  }

  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === current) return;
    clearChain();
    if (current >= 0) {
      slides[current].classList.remove('active');
      setAnimations(slides[current], false);
    }
    current = i;
    slides[current].classList.add('active');
    var fresh = slides[current].querySelector('[data-steps]');
    if (fresh) {
      var jumpTo = 0;
      var q = parseInt(new URLSearchParams(location.search).get('step') || '', 10);
      if (!isNaN(q)) jumpTo = Math.max(0, Math.min(stepMax(fresh), q));
      setStep(fresh, jumpTo);
    }
    setAnimations(slides[current], true);
    location.hash = String(i + 1);
    var n = DECK.APPENDIX_START;
    hud.innerHTML = (i < n)
      ? (i + 1) + ' / ' + n
      : '<span class="appendix-tag">appendix ' + (i - n + 1) + ' / ' + (slides.length - n) + '</span>';
    syncSkip();
    syncNav();
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); }
  setInterval(fit, 400); /* insurance against embedders that miss resize events */
  fit();

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      if (e.repeat) return;
      if (!stepFwd()) show(current + 1);
    }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      if (e.repeat) return;
      if (!stepBack()) show(current - 1);
    }
    else if (e.key === 'ArrowDown' || e.key === 'n') {
      e.preventDefault();
      if (e.repeat) return;
      nextSlide();
    }
    else if (e.key === 'ArrowUp' || e.key === 'p') {
      e.preventDefault();
      if (e.repeat) return;
      prevSlide();
    }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(DECK.APPENDIX_START - 1); }
    else if (e.key === 'a') { show(DECK.APPENDIX_START); }
    else if (e.key === 'f') { toggleFull(); }
    else if (e.key === 'm') { toggleNav(); }
    else if (e.key === 'Escape') { toggleNav(false); }
  });

  /* touch: tap right/left half. inside a stepped slide, consume clicks as steps. */
  document.addEventListener('click', function (e) {
    if (navOpen()) { toggleNav(false); return; }
    if (e.target.closest('a') || e.target.closest('.skipbtn')) return;
    var goRight = e.clientX > window.innerWidth / 2;
    if (goRight) { if (!stepFwd()) show(current + 1); }
    else { if (!stepBack()) show(current - 1); }
  });

  var fromHash = parseInt((location.hash || '').replace('#', ''), 10);
  show(isNaN(fromHash) ? 0 : fromHash - 1);

  /* Remote control from a second device. Only works when the deck is served by
     serve.py (plain http.server has no /_poll, so the first fetch fails and this
     quietly does nothing). The phone sends commands; the deck stays in charge of
     what "next" means, so sub-steps behave exactly as they do at the keyboard. */
  (function remoteLink() {
    var since = -1, live = false;

    function act(cmd) {
      if (cmd === 'next') { if (!stepFwd()) show(current + 1); }
      else if (cmd === 'prev') { if (!stepBack()) show(current - 1); }
      else if (cmd === 'nextslide') { nextSlide(); }
      else if (cmd === 'prevslide') { prevSlide(); }
      else if (cmd === 'first') { show(0); }
      else if (cmd === 'appendix') { show(DECK.APPENDIX_START); }
      else if (cmd === 'end') { show(DECK.APPENDIX_START - 1); }
      else if (cmd === 'full') { toggleFull(); }
    }

    function report() {
      if (!live) return;
      var el = stepper();
      fetch('/_pos?slide=' + (current + 1) + '&n=' + DECK.APPENDIX_START +
            '&step=' + (el ? stepNow(el) : 0) + '&steps=' + (el ? stepMax(el) : 0))
        .catch(function () {});
    }

    function poll() {
      fetch('/_poll?since=' + since).then(function (r) {
        if (!r.ok) throw 0;
        return r.json();
      }).then(function (st) {
        if (!live) { live = true; presentBtn.classList.add('linked'); }
        if (since >= 0 && st.rev > since && st.cmd) { act(st.cmd); report(); }
        since = st.rev;
        poll();
      }).catch(function () {
        if (live) { live = false; presentBtn.classList.remove('linked'); }
        if (since < 0) return;                 /* never connected: give up quietly */
        setTimeout(poll, 2000);
      });
    }
    poll();
    setInterval(report, 1500);
  })();
  var stepQ = parseInt(new URLSearchParams(location.search).get('step') || '', 10);
  if (!isNaN(stepQ)) {
    var jump = stepper();
    if (jump) setStep(jump, Math.max(0, Math.min(stepMax(jump), stepQ)));
  }

  /* pause everything when printing */
  window.addEventListener('beforeprint', function () {
    slides.forEach(function (s) {
      setAnimations(s, false);
      var el = s.querySelector('[data-steps]');
      if (el) setStep(el, stepMax(el));
    });
  });
})();
</script>
</body>
</html>
