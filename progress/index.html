<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>September progress · Andrews–Curtis search</title>
<!-- Second deck, same look as ../index.html. Slides live in slides_p.js, numbers in stats.js
     (generated by data/make_stats.py). Press c on any slide to leave a review comment. -->
<link rel="stylesheet" href="comments.css?v=2">
<style>
  @font-face { font-family: 'Figtree'; src: url('../fonts/figtree-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Figtree'; src: url('../fonts/figtree-600.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Figtree'; src: url('../fonts/figtree-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../fonts/plexmono-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }

  :root {
    --paper: #FAF9F6;
    --ink: #191813;
    --blue: #2B54C4;
    --orange: #E05B2B;
    --hair: rgba(25, 24, 19, 0.15);
    --sans: 'Figtree', -apple-system, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }

  .viewport { position: fixed; inset: 0; }
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    background: var(--paper);
  }
  .slide {
    position: absolute; inset: 0; display: none; flex-direction: column;
    padding: 88px 84px 56px; overflow: hidden;
  }
  .slide.active { display: flex; }
  .slide header { display: flex; align-items: baseline; justify-content: space-between; gap: 40px; flex: 0 0 auto; }
  .slide h1 { font-weight: 700; font-size: 62px; letter-spacing: -0.02em; line-height: 0.98; max-width: 20ch; }
  .kicker { font-family: var(--mono); font-size: 24px; color: rgba(25, 24, 19, 0.6); text-align: right; max-width: 30ch; line-height: 1.35; }
  .viz { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; margin-top: 24px; }
  .viz svg { width: 100%; height: 100%; }
  .mono { font-family: var(--mono); } .blue { color: var(--blue); } .orange { color: var(--orange); } .dim { opacity: 0.6; }

  /* title slide */
  .slide.title-slide { justify-content: center; }
  .title-slide h1 { font-size: 84px; letter-spacing: -0.03em; line-height: 1.02; max-width: none; }
  .title-slide .sub { font-family: var(--mono); font-size: 28px; opacity: 0.55; margin-top: 28px; }
  .title-slide .hint { font-family: var(--mono); font-size: 20px; opacity: 0.35; margin-top: 90px; line-height: 1.6; }

  .hud { position: absolute; right: 36px; bottom: 28px; z-index: 5; font-family: var(--mono); font-size: 28px;
         color: var(--ink); opacity: 0.55; transition: opacity 0.2s; user-select: none; }
  .viewport:hover .hud { opacity: 0.7; }
  .hud .appendix-tag { color: var(--orange); }

  .presentbtn, .deckswitch {
    position: absolute; z-index: 6; font-family: var(--mono); font-size: 20px; line-height: 1;
    color: var(--ink); background: none; text-decoration: none;
    border: 1px solid rgba(25, 24, 19, 0.25); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; opacity: 0.3; transition: opacity 0.2s;
  }
  .presentbtn { left: 36px; bottom: 36px; }
  .deckswitch { right: 28px; top: 22px; opacity: 0.22; }
  .presentbtn:hover, .deckswitch:hover { opacity: 0.9; }

  .navbtn {
    position: absolute; left: 28px; top: 22px; z-index: 8; width: 46px; height: 46px; padding: 0;
    font-family: var(--mono); font-size: 21px; line-height: 1; color: var(--ink); background: none; cursor: pointer;
    border: 1px solid rgba(25, 24, 19, 0.22); border-radius: 999px; opacity: 0.22; transition: opacity 0.2s;
  }
  .navbtn:hover, .navbtn.open { opacity: 0.9; }
  .navmenu {
    position: absolute; left: 28px; top: 80px; z-index: 8; width: 560px; max-height: 880px; overflow-y: auto;
    padding: 10px; border-radius: 18px; background: var(--paper);
    border: 1px solid rgba(25, 24, 19, 0.14); box-shadow: 0 26px 64px rgba(25, 24, 19, 0.18);
    opacity: 0; transform: translateX(-16px); pointer-events: none; transition: opacity 0.16s, transform 0.16s;
  }
  .navmenu.open { opacity: 1; transform: none; pointer-events: auto; }
  .navmenu button, .navmenu a {
    display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 8px 14px; border: 0; border-radius: 10px;
    background: none; cursor: pointer; text-align: left; text-decoration: none;
    font-family: var(--mono); font-size: 18px; line-height: 1.3; color: var(--ink);
  }
  .navmenu .num { flex: 0 0 40px; opacity: 0.4; }
  .navmenu button:hover, .navmenu a:hover { background: rgba(43, 84, 196, 0.10); color: var(--blue); }
  .navmenu button.on { background: var(--ink); color: var(--paper); }
  .navmenu button.on .num { opacity: 0.65; }
  .navmenu button.apx .num { color: var(--orange); opacity: 0.9; }
  .navmenu .rule { border-top: 1px solid rgba(25, 24, 19, 0.12); margin: 8px 14px; }

  .placeholder-missing { display: flex; align-items: center; justify-content: center; height: 100%;
    font-family: var(--mono); font-size: 30px; color: var(--orange); }

  /* sub-steps: <div class="step-root" data-steps="N"> ... elements with data-at="0 1 2" */
  .step-root { flex: 1 1 auto; min-height: 0; height: 100%; display: flex; flex-direction: column; }
  [data-steps] [data-at] { opacity: 0; pointer-events: none; transition: opacity 0.38s ease; }

  @media print {
    @page { size: 1440px 1080px; margin: 0; }
    html, body { overflow: visible; height: auto; }
    .viewport { position: static; }
    .stage { position: static; transform: none !important; width: 1440px; height: auto; }
    .slide { position: relative !important; inset: auto; display: flex !important; width: 1440px; height: 1080px;
             page-break-after: always; break-after: page; }
    .hud, .presentbtn, .navbtn, .navmenu, .deckswitch { display: none !important; }
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage"></div>
  <div class="hud" id="hud"></div>
</div>

<script>
  window.DECK = {
    parts: {},
    register: function (id, html) { this.parts[id] = html; },
    ORDER: [],            /* filled by slides_p.js */
    APPENDIX_START: 0
  };
  /* reveal rules for sub-steps, generated instead of hand-written */
  (function () {
    var css = [];
    for (var n = 0; n <= 24; n++) css.push('[data-steps][data-step="' + n + '"] [data-at~="' + n + '"]');
    var st = document.createElement('style');
    st.textContent = css.join(',\n') + ' { opacity: 1; pointer-events: auto; }';
    document.head.appendChild(st);
  })();
</script>
<script src="stats.js?v=3"></script>
<script src="slides_p.js?v=17"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var hud = document.getElementById('hud');

  DECK.ORDER.forEach(function (id) {
    var sec = document.createElement('section');
    sec.className = 'slide' + (id.indexOf('title') >= 0 ? ' title-slide' : '');
    sec.id = id;
    sec.innerHTML = DECK.parts[id] || '<div class="placeholder-missing">missing part: ' + id + '</div>';
    stage.appendChild(sec);
  });
  stage.appendChild(hud);

  var presentBtn = document.createElement('button');
  presentBtn.type = 'button'; presentBtn.className = 'presentbtn'; presentBtn.title = 'fullscreen  (f)';
  presentBtn.textContent = 'present ⤢';
  stage.appendChild(presentBtn);
  presentBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFull(); });
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
  document.addEventListener('fullscreenchange', function () {
    presentBtn.textContent = document.fullscreenElement ? 'exit ⤡' : 'present ⤢';
    fit();
  });

  var sw = document.createElement('a');
  sw.className = 'deckswitch'; sw.href = '../#1'; sw.title = 'back to the SURF talk';
  sw.textContent = '← talk';
  stage.appendChild(sw);

  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var current = -1;
  var N = DECK.APPENDIX_START || slides.length;

  var navBtn = document.createElement('button');
  navBtn.type = 'button'; navBtn.className = 'navbtn'; navBtn.title = 'slides  (m)'; navBtn.textContent = '☰';
  var navMenu = document.createElement('div');
  navMenu.className = 'navmenu';
  var navBtns = slides.map(function (sec, i) {
    var h = sec.querySelector('h1');
    var tmp = document.createElement('div');
    tmp.innerHTML = h ? h.innerHTML.replace(/<br\s*\/?>/gi, ' ') : '';
    var title = (h ? tmp.textContent : sec.id).replace(/\s+/g, ' ').trim().slice(0, 58) || 'slide ' + (i + 1);
    if (i === N && N < slides.length) { var rule = document.createElement('div'); rule.className = 'rule'; navMenu.appendChild(rule); }
    var b = document.createElement('button');
    b.type = 'button';
    if (i >= N) b.className = 'apx';
    b.innerHTML = '<span class="num"></span><span class="lab"></span>';
    b.firstChild.textContent = (i < N) ? String(i + 1) : 'A' + (i - N + 1);
    b.lastChild.textContent = title;
    b.addEventListener('click', function (e) { e.stopPropagation(); toggleNav(false); show(i); });
    navMenu.appendChild(b);
    return b;
  });
  var rule2 = document.createElement('div'); rule2.className = 'rule'; navMenu.appendChild(rule2);
  var back = document.createElement('a'); back.href = '../#1';
  back.innerHTML = '<span class="num">←</span><span class="lab">the SURF talk</span>';
  navMenu.appendChild(back);
  stage.appendChild(navBtn);
  stage.appendChild(navMenu);
  navBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleNav(); });
  function toggleNav(force) {
    var on = (force === undefined) ? !navMenu.classList.contains('open') : !!force;
    navMenu.classList.toggle('open', on); navBtn.classList.toggle('open', on);
    if (on) syncNav();
  }
  function navOpen() { return navMenu.classList.contains('open'); }
  function syncNav() {
    for (var k = 0; k < navBtns.length; k++) navBtns[k].classList.toggle('on', k === current);
    var b = navBtns[current];
    if (b && navOpen()) navMenu.scrollTop = b.offsetTop - (navMenu.clientHeight - b.offsetHeight) / 2;
  }

  function stepper() { var sec = slides[current]; return sec ? sec.querySelector('[data-steps]') : null; }
  function stepMax(el) { return parseInt(el.getAttribute('data-steps'), 10) || 0; }
  function stepNow(el) { return parseInt(el.getAttribute('data-step') || '0', 10) || 0; }
  function setStep(el, n) { el.setAttribute('data-step', String(n)); }
  function stepFwd() { var el = stepper(); if (!el) return false; var s = stepNow(el); if (s < stepMax(el)) { setStep(el, s + 1); return true; } return false; }
  function stepBack() { var el = stepper(); if (!el) return false; var s = stepNow(el); if (s > 0) { setStep(el, s - 1); return true; } return false; }

  function show(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === current) return;
    if (current >= 0) slides[current].classList.remove('active');
    current = i;
    slides[current].classList.add('active');
    var fresh = slides[current].querySelector('[data-steps]');
    if (fresh) setStep(fresh, 0);
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
    hud.innerHTML = (i < N) ? (i + 1) + ' / ' + N
      : '<span class="appendix-tag">appendix ' + (i - N + 1) + ' / ' + (slides.length - N) + '</span>';
    syncNav();
    window.dispatchEvent(new CustomEvent('deck:show', { detail: { index: i } }));
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 1080);
    stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  setInterval(fit, 400);
  fit();

  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented) return;
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); if (e.repeat) return; if (!stepFwd()) show(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (e.repeat) return; if (!stepBack()) show(current - 1); }
    else if (e.key === 'ArrowDown' || e.key === 'n') { e.preventDefault(); show(current + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'p') { e.preventDefault(); show(current - 1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(N - 1);
    else if (e.key === 'a' && N < slides.length) show(N);
    else if (e.key === 'f') toggleFull();
    else if (e.key === 'm') toggleNav();
    else if (e.key === 'Escape') toggleNav(false);
  });

  document.addEventListener('click', function (e) {
    if (navOpen()) { toggleNav(false); return; }
    if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.cmt-panel')) return;
    if (document.body.classList.contains('cmt-open')) return;   /* reviewing: clicks never turn pages */
    if (e.clientX > window.innerWidth / 2) { if (!stepFwd()) show(current + 1); }
    else { if (!stepBack()) show(current - 1); }
  });

  function fromHash() { var n = parseInt((location.hash || '').replace('#', ''), 10); return isNaN(n) ? 0 : n - 1; }
  window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== current) show(i); });
  show(fromHash());
  var stepQ = parseInt(new URLSearchParams(location.search).get('step') || '', 10);
  if (!isNaN(stepQ) && stepper()) setStep(stepper(), Math.max(0, Math.min(stepMax(stepper()), stepQ)));

  DECK.api = {
    stage: stage, slides: slides, show: show,
    current: function () { return current; },
    stepNow: function () { var el = stepper(); return el ? stepNow(el) : 0; }
  };

  /* pdf: one page per sub-step */
  var printExpanded = false;
  function expandForPrint() {
    if (printExpanded) return;
    printExpanded = true;
    slides.forEach(function (s) {
      var el = s.querySelector('[data-steps]');
      if (!el) return;
      for (var n = 0; n <= stepMax(el); n++) {
        var c = s.cloneNode(true);
        c.classList.add('active');
        c.querySelector('[data-steps]').setAttribute('data-step', String(n));
        s.parentNode.insertBefore(c, s);
      }
      s.parentNode.removeChild(s);
    });
  }
  if (/[?&]print\b/.test(location.search)) expandForPrint();
  window.addEventListener('beforeprint', expandForPrint);
})();
</script>
<script src="comments.js?v=2"></script>
</body>
</html>
